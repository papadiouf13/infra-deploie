---
# =====================================================================
# group_vars/all.yml — variables communes à TOUS les environnements.
#
# Les variables sensibles (mots de passe, tokens, webhooks) sont dans
# group_vars/vault.yml (fichier chiffré ansible-vault, NON commité ;
# un exemple est fourni : vault.yml.example).
# Les valeurs spécifiques par environnement sont dans group_vars/dev.yml
# et group_vars/prod.yml.
# =====================================================================

# ---- Identité ----
# environment_name est dérivé du groupe d'inventaire (dev ou prod).
environment_name: "{{ group_names[0] }}"
# server_name est une variable d'hôte définie dans l'inventaire (dev-server, prod-server).

# ---- Utilisateur / connexion SSH ----
ansible_user: mamadou
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
ansible_python_interpreter: /usr/bin/python3

# ---- Admin ----
# CIDR autorisés sur les interfaces protégées par ipAllowList
# (Prometheus, dashboard Traefik). Restreindre impérativement en production.
admin_cidr:
  - "0.0.0.0/0"
admin_email: "mamadou173diouf@gmail.com"

# ---- Hostnames ----
# Tous les hostnames dérivent d'une SEULE variable : infra_domain.
#   - Par défaut : nip.io (basé sur l'IP publique) : aucune configuration DNS.
#   - Vrai domaine : redéfinir infra_domain dans un groupe especial group_vars/<env>.yml
#     (ex : "tioukh.duckdns.org") — tous les services suivent automatiquement.
infra_domain: "{{ public_ip }}.nip.io"
grafana_host: "grafana.{{ infra_domain }}"
prometheus_host: "prometheus.{{ infra_domain }}"
traefik_host: "traefik.{{ infra_domain }}"
sonar_host: "sonar.{{ infra_domain }}"
whoami_host: "whoami.{{ infra_domain }}"

# ---- TLS / ACME ----
# traefik_cert_type : "letsencrypt" (par défaut) ou "selfsigned".
# acme_is_staging : true en dev pour éviter les rate-limits Let's Encrypt.
# acme_challenge :
#   - "http" : HTTP-01 (défaut) — nécessite une IP/domaine joignable depuis internet.
#   - "dns"  : DNS-01 — fonctionne même en IP privée/NAT (validation par enregistrements TXT).
# acme_dns_provider : nom du provider lego pour DNS-01 (ex : "duckdns", "cloudflare"...).
# acme_dns_resolvers : résolveurs utilisés par Traefik pour vérifier la propagation TXT.
# acme_dns_env_key / acme_dns_env_value : variable d'environnement fournie au conteneur
# Traefik pour l'API du provider (pour duckdns : DUCKDNS_TOKEN + duckdns_token du vault).
traefik_cert_type: letsencrypt
acme_is_staging: false
acme_challenge: http
acme_dns_provider: duckdns
acme_dns_resolvers:
  - "1.1.1.1:53"
  - "8.8.8.8:53"
acme_dns_env_key: "DUCKDNS_TOKEN"
acme_dns_env_value: "{{ duckdns_token }}"
# Wildcard : avec DNS-01, un SEUL certificat "*.{{ infra_domain }}" pour tous les
# services (nécessaire pour DuckDNS : un seul enregistrement _acme-challenge,
# éviter les collisions entre demandes concurrentes). Hors DNS-01 (http challenge),
# un certificat est émis par hôte.
acme_use_wildcard: false
# Délai (s) avant de vérifier la propagation DNS-01 (DuckDNS est lent en propagation).
acme_dns_delay_before_check: 15
# Les hash bcrypt des middlewares basic-auth (Prometheus/Traefik) sont
# PRECALCULES (scripts/gen-bcrypt-hash.sh) et stockés dans le vault :
# aucune dépendance passlib/bcrypt côté contrôleur à l'exécution.

# ---- Réseaux Docker (created par le rôle docker) ----
# Subnets fixes : utilisés aussi pour les règles UFW (accès aux métriques
# du daemon Docker 9323 depuis les réseaux monitoring/proxy).
docker_networks:
  proxy:
    name: proxy
    subnet: "172.30.0.0/24"
    gateway: "172.30.0.1"
  monitoring:
    name: monitoring
    subnet: "172.30.1.0/24"
    gateway: "172.30.1.1"
  # Réseau "back" : données & API privées des apps (jamais exposé).
  # Créé/garanti par le rôle app_deploy ; utilisé par les apps en compose
  # avec « external: true » (référencé aussi par le learning hub).
  back:
    name: back
    subnet: "172.30.10.0/24"
    gateway: "172.30.10.1"

# ---- Versions des images (épinglées ; ajustables) ----
images:
  traefik: "traefik:v3.7.13"
  node_exporter: "prom/node-exporter:v1.8.2"
  cadvisor: "ghcr.io/google/cadvisor:v0.60.5"
  prometheus: "prom/prometheus:v2.54.1"
  loki: "grafana/loki:3.2.2"
  alloy: "grafana/alloy:v1.3.1"
  grafana: "grafana/grafana:11.2.2"
  whoami: "traefik/whoami:v1.10.1"
  sonarqube: "sonarqube:lts-community"
  postgres: "postgres:16-alpine"
  trivy: "aquasec/trivy:0.57.1"

# ---- Trivy : scan de vulnérabilités des images des conteneurs du serveur ----
# Scan quotidien (timer systemd) des images des conteneurs actifs ; résultats
# JSONL relus par Alloy -> Loki -> dashboard + alerte Grafana.
trivy_schedule: "*-*-* 03:05:00"
trivy_severities: HIGH,CRITICAL
trivy_ignore_unfixed: true
trivy_base_dir: /opt/trivy
trivy_cache_dir: /opt/trivy/cache
trivy_report_dir: /opt/trivy/reports

# ---- Alerting : SEUILS (configurables) ----
alerts:
  server:
    unreachable_for: "2m"
    cpu_warning: 80
    cpu_critical: 90
    cpu_for: "10m"
    ram_warning: 80
    ram_critical: 90
    ram_for: "10m"
    disk_warning: 80
    disk_critical: 90
    disk_for: "10m"
    disk_full_prediction_hours: 24
    reboot_window: "5m"
  docker:
    container_stopped_after: "60s"
    restart_threshold: 3            # restarts détectés sur la fenêtre
    restart_window: "15m"
    cpu_limit_pct: 90               # consommation conteneur vs limite
    mem_limit_pct: 90
    oom_mem_limit_pct: 95
  monitoring:
    target_down_for: "2m"
  traefik:
    error_5xx_pct: 5                # taux d'erreurs 5xx
    latency_p95_seconds: 3          # latence p95 en secondes
    latency_min_req_s: 0.1         # trafic minimal pour fiabiliser la latence p95 (~6 req/min)
    cert_expiry_days: 14            # alerte avant expiration du certificat

# ---- Contact points (Grafana Alerting) ----
# Les identifiants/tokens sont dans group_vars/vault.yml.
alerting:
  email:
    enabled: true
    to: "admin@example.com"
    smtp_host: "smtp.example.com"
    smtp_port: 465
    smtp_from: "monitoring@example.com"
    smtp_from_name: "Infra Monitoring"
    smtp_user: ""
    smtp_password: ""
    smtp_starttls: false
  telegram:
    enabled: true
    bot_token: ""
    chat_id: ""
  slack:
    enabled: true
    webhook_url: ""
  discord:
    enabled: false
    webhook_url: ""

# ---- Rétention des métriques / logs (par défaut ; redéfini par env) ----
monitoring_retention_days: 15
loki_retention_hours: 168           # 7 j par défaut

# ---- SonarQube (lourd : activé par défaut uniquement en prod) ----
enable_sonarqube: false
sonarqube_mem_limit: "2g"
sonarqube_cpu_limit: 1.5

# ---- DuckDNS : mise à jour automatique (optionnel, vide = désactivé) ----
# duckdns_token et duckdns_domains (ex: "tioukh,grafana-tioukh") → cron périodique.
duckdns_token: ""
duckdns_domains: ""

# ---- Sondes de healthcheck "fréquences" ----
monitoring_scrape_interval: 15s

# ---- Dashboards provisionnés dans Grafana (fichiers sous roles/grafana/templates/dashboards) ----
grafana_dashboards:
  - overview          # page d'accueil (NOC) : santé, trafic, disponibilité, alertes
  - infrastructure    # hôte : CPU, RAM, disques, réseau
  - docker            # conteneurs : état, top consommateurs, évolution
  - traefik           # reverse-proxy : codes HTTP, latence (percentiles + heatmap), TLS, access logs
  - applications      # apps déployées : santé, trafic par router, ressources, journaux
  - logs              # Loki : explorateur, erreurs, sécurité SSH/fail2ban
  - trivy             # vulnérabilités CRITICAL/HIGH par image

# Apparence Grafana : "dark" ou "light".
grafana_default_theme: "dark"

# Plugins de panels Grafana optionnels (les dashboards fournis n'en ont PAS
# besoin : panels natifs uniquement). Exemples :
#   - grafana-polystat-panel
#   - marcusolsson-treemap-panel
#   - volkovlabs-echarts-panel
# Nécessite un accès Internet du conteneur au démarrage.
grafana_plugins: []

# Buckets (secondes) de l'histogramme de latence Traefik (heatmap Grafana).
traefik_metrics_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
