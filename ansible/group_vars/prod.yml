---
# =====================================================================
# group_vars/prod.yml — spécificités de l'environnement PROD.
# =====================================================================

# ---- TLS : Let's Encrypt en production ----
acme_is_staging: false

# ---- Rétention adaptée à la prod ----
monitoring_retention_days: 30
loki_retention_hours: 336           # 14 j

# ---- Hostnames : si un vrai domaine est disponible, redéfinir ici ----
# grafana_host: "grafana.example.com"
# prometheus_host: "prometheus.example.com"
# traefik_host: "traefik.example.com"
# sonar_host: "sonar.example.com"

# ---- SonarQube activé (par défaut uniquement en prod) ----
enable_sonarqube: true