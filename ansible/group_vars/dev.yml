---
# =====================================================================
# group_vars/dev.yml — spécificités de l'environnement DEV.
# =====================================================================

# ---- Domaine : DuckDNS (portable — seule variable à changer par serveur) ----
infra_domain: "tioukh.duckdns.org"

# ---- TLS : certificats RÉELS Let's Encrypt via DNS-01 (défaut stagings : false).
#      DNS-01 permet d'émettre des certificats valides même en IP privée.
#      Wildcard activé : un seul cert *.<domaine> pour tous les services (DuckDNS). ----
acme_is_staging: false
acme_challenge: dns
acme_use_wildcard: true

# ---- Rétention volontairement courte en dev ----
monitoring_retention_days: 7
loki_retention_hours: 72            # 3 j

# ---- Hostnames : redéfinis automatiquement via infra_domain ci-dessus ----

# ---- SonarQube désactivé en dev (RAM de 2 Go trop juste) ----
enable_sonarqube: false

# ---- Utilisateur cible du déploiement CI/CD (celui du compte SSH papa,
#      ~/.ssh/authorized_keys et /opt/apps doivent lui appartenir) ----
app_deploy_user: papa