---
# =====================================================================
# site.yml — pile complète de monitoring sur UN serveur.
#
#   ansible-playbook -i inventories/dev/hosts.ini playbooks/site.yml
#
# Ordre d'installation :
#   1. common   : durcissement (UFW, fail2ban), upgrades auto, DuckDNS
#   2. docker   : daemon.json (logs + metrics-addr) et réseaux
#   3. traefik  : reverse-proxy TLS + whoami (test des routes)
#   4. node_exporter / cadvisor : métriques hôte + conteneurs
#   5. prometheus : collecte
#   6. loki / alloy : journaux centralisés
#   7. grafana  : console + alerting
#   8. trivy    : scan quotidien des vulnérabilités des images de conteneurs
#   9. sonarqube : (seulement si enable_sonarqube, par défaut en prod)
# =====================================================================

- name: Provisionner la pile de monitoring
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Variables partagées (group_vars/all.yml)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all.yml"

    - name: Secrets (group_vars/vault.yml)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/vault.yml"
      no_log: true

    - name: Variables d'environnement (group_vars/{{ env }}.yml)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/{{ env }}.yml"
      vars:
        env: "{{ 'dev' if 'dev' in group_names else 'prod' }}"

    - name: Fichier server_vars.yml présent ?
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../group_vars/server_vars.yml"
      register: server_vars
      tags: always

    - name: Variables spécifiques au serveur (group_vars/server_vars.yml, optionnel)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/server_vars.yml"
      when: server_vars.stat.exists

    - name: Prétâche - disponibilité des variables
      ansible.builtin.assert:
        that:
          - enable_sonarqube is defined
          - monitoring_retention_days is defined
        fail_msg: "group_vars all/dev/prod sont requis."

  roles:
    - common
    - docker
    - traefik
    - node_exporter
    - cadvisor
    - prometheus
    - loki
    - alloy
    - grafana
    - trivy
    - role: sonarqube
      when: enable_sonarqube | bool

  post_tasks:
    - name: Récapitulatif des URLs
      ansible.builtin.debug:
        msg:
          - "Grafana   : https://{{ grafana_host }}"
          - "Prometheus: https://{{ prometheus_host }}"
          - "Traefik   : https://{{ traefik_host }}"
          - "Whoami    : https://{{ whoami_host }}"
          - "SonarQube : https://{{ sonar_host }} (prod uniquement)"
          - "Aucun port d'application exposé en dehors de 80/443 (Traefik)."