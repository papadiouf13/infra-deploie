---
# =====================================================================
# NODE EXPORTER — métriques système (CPU, RAM, disque, réseau, load).
# Réseau monitoring uniquement : jamais routé par Traefik.
# =====================================================================

- name: Node Exporter - répertoire
  ansible.builtin.file:
    path: /opt/node-exporter
    state: directory
    mode: "0755"

- name: Node Exporter - docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/node-exporter/docker-compose.yml
    mode: "0644"

- name: Node Exporter - démarrer / mettre à jour
  community.docker.docker_compose_v2:
    project_src: /opt/node-exporter
    state: present
    pull: missing

- name: Node Exporter - vérifier que les métriques répondent (réseau monitoring)
  ansible.builtin.command:
    cmd: docker run --rm --network monitoring curlimages/curl:8.7.1 -fs http://node-exporter:9100/metrics
  register: ne_metrics
  until: ne_metrics.rc == 0
  retries: 10
  delay: 3
  changed_when: false