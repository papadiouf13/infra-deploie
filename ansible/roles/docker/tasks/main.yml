---
# =====================================================================
# DOCKER — installation du moteur + plugin compose + réseaux partagés
# + daemon.json (rotation des logs, métriques Prometheus).
# =====================================================================

- name: Apt - dépendances
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker - répertoire des clés GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker - clé GPG officielle
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker - dépôt APT officiel
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Apt - mise à jour du cache après ajout du dépôt
  ansible.builtin.apt:
    update_cache: true

- name: Docker - installer le moteur, le CLI et les plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present

- name: Docker - démarrer et activer au boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Docker - ajouter l'utilisateur ansible au groupe docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Docker - mémoriser le GID du groupe docker (pour docker_sd Prometheus)
  ansible.builtin.command: getent group docker
  register: docker_group_ent
  changed_when: false

- name: Docker - exposer le GID docker en fait
  ansible.builtin.set_fact:
    docker_group_gid: "{{ docker_group_ent.stdout.split(':')[2] | int }}"
  when: docker_group_ent.stdout is defined

# ----------------------------- daemon.json -----------------------------
- name: Docker - configuration daemon (rotation logs + métriques)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Redémarrer Docker

# ----------------------------- Réseaux partagés -----------------------------
- name: Docker - réseau proxy (Traefik + services web)
  community.docker.docker_network:
    name: "{{ docker_networks.proxy.name }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: br-proxy
    ipam_config:
      - subnet: "{{ docker_networks.proxy.subnet }}"
        gateway: "{{ docker_networks.proxy.gateway }}"
    state: present

- name: Docker - réseau monitoring (collecteurs, aucun port publié)
  community.docker.docker_network:
    name: "{{ docker_networks.monitoring.name }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: br-monitoring
    ipam_config:
      - subnet: "{{ docker_networks.monitoring.subnet }}"
        gateway: "{{ docker_networks.monitoring.gateway }}"
    state: present

- name: Docker - vérifier l'installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Docker - afficher la version
  ansible.builtin.debug:
    var: docker_version.stdout